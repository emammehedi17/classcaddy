                q: "কতজন বালককে 125 টি কমলা লেবু এবং 145 টি কলা সমানভাবে ভাগ করে দেয়া যায়?",
                a: "25 জন",
                b: "35 জন",
                c: "15 জন",
                d: "5 জন",
                ans: "d",
                note: "১২৫ এবং ১৪৫টি ফল সমানভাবে ভাগ করে দেওয়ার জন্য সংখ্যা দুটির গ.সা.গু নির্ণয় করতে হবে।<br>$125 = 5 \\times 5 \\times 5$ এবং $145 = 5 \\times 29$<br>সংখ্যা দুটির গ.সা.গু হলো <b>5</b>। সুতরাং <b>5 জন</b> বালককে ফলগুলো সমানভাবে ভাগ করে দেওয়া যাবে।"
            }
        ];

        let notesVisible = true;

        function renderQuestions(data) {
            const container = document.getElementById('questionsContainer');
            const countDisplay = document.getElementById('countDisplay');
            container.innerHTML = '';
            countDisplay.textContent = `মোট ${data.length}টি প্রশ্ন প্রদর্শিত হচ্ছে`;

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'question-card bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden';

                const getOptionStyle = (optKey) => {
                    const isCorrect = item.ans === optKey;
                    return isCorrect 
                        ? 'bg-emerald-50 border-emerald-400 text-emerald-950 font-semibold ring-1 ring-emerald-400' 
                        : 'bg-slate-50/70 border-slate-200 text-slate-700 hover:bg-slate-100';
                };

                const getBadgeStyle = (optKey) => {
                    const isCorrect = item.ans === optKey;
                    return isCorrect
                        ? 'bg-emerald-600 text-white'
                        : 'bg-slate-200 text-slate-700';
                };

                card.innerHTML = `
                    <div class="p-5 md:p-6">
                        <!-- Question Header -->
                        <div class="flex items-start gap-3 mb-4">
                            <span class="inline-flex items-center justify-center bg-indigo-600 text-white text-sm font-bold px-3 py-1 rounded-lg shrink-0 mt-0.5 shadow-sm">
                                ${item.id}.
                            </span>
                            <h2 class="text-base md:text-lg font-bold text-slate-800 leading-snug">
                                ${item.q}
                            </h2>
                        </div>

                        <!-- Options Grid -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 my-4">
                            <div class="flex items-center gap-2.5 p-3 rounded-lg border text-sm md:text-base ${getOptionStyle('a')}">
                                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${getBadgeStyle('a')}">a</span>
                                <span>${item.a}</span>
                            </div>
                            <div class="flex items-center gap-2.5 p-3 rounded-lg border text-sm md:text-base ${getOptionStyle('b')}">
                                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${getBadgeStyle('b')}">b</span>
                                <span>${item.b}</span>
                            </div>
                            <div class="flex items-center gap-2.5 p-3 rounded-lg border text-sm md:text-base ${getOptionStyle('c')}">
                                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${getBadgeStyle('c')}">c</span>
                                <span>${item.c}</span>
                            </div>
                            <div class="flex items-center gap-2.5 p-3 rounded-lg border text-sm md:text-base ${getOptionStyle('d')}">
                                <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold shrink-0 ${getBadgeStyle('d')}">d</span>
                                <span>${item.d}</span>
                            </div>
                        </div>

                        <!-- Correct Answer Line -->
                        <div class="mt-3 flex items-center gap-2">
                            <span class="inline-flex items-center gap-1.5 bg-emerald-100 text-emerald-800 text-xs md:text-sm font-bold px-3 py-1 rounded-md border border-emerald-300">
                                <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path>
                                </svg>
                                correct answer: ${item.ans}
                            </span>
                        </div>

                        <!-- Note / Explanation Box -->
                        <div class="note-box mt-4 bg-amber-50/70 border-l-4 border-indigo-500 rounded-r-lg p-4 text-sm md:text-base text-slate-700 leading-relaxed ${notesVisible ? '' : 'hidden'}">
                            <span class="font-bold text-indigo-900 underline decoration-amber-400 decoration-2 underline-offset-4 mr-1">Note:</span>
                            <span>${item.note}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            // Re-typeset MathJax after DOM update
            if (window.MathJax && window.MathJax.typesetPromise) {
                window.MathJax.typesetPromise();
            }
        }

        function toggleAllNotes() {
            notesVisible = !notesVisible;
            const notes = document.querySelectorAll('.note-box');
            notes.forEach(n => {
                if (notesVisible) {
                    n.classList.remove('hidden');
                } else {
                    n.classList.add('hidden');
                }
            });
        }

        // Search Filter
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderQuestions(mcqData);
                return;
            }
            const filtered = mcqData.filter(item => 
                item.q.toLowerCase().includes(query) ||
                item.a.toLowerCase().includes(query) ||
                item.b.toLowerCase().includes(query) ||
                item.c.toLowerCase().includes(query) ||
                item.d.toLowerCase().includes(query) ||
                item.note.toLowerCase().includes(query) ||
                item.id.toString() === query
            );
            renderQuestions(filtered);
        });

        // Initial Render on Load
        window.onload = function() {
            renderQuestions(mcqData);
        };
    </script>
</body>
</html>
