        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }

        #reader-modal {

            right: 20px !important;
            width: 380px !important;
            height: 480px !important;

            left: auto !important;

<body class="bg-slate-50 min-h-screen pb-12">

                <div class="w-full md:w-1/3 relative">

                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->

        </div>

        <!-- Author Grid (Compact Layout) -->
        <div id="author-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards will be injected here by JS -->
        </div>
    </div>

    <!-- Reader Modal -->
    <div id="reader-modal" class="fixed inset-0 z-50 flex-col bg-white hidden">
        <!-- Modal Toolbar -->
        <div class="h-14 bg-slate-900 text-white flex justify-between items-center px-4 shadow-md select-none rounded-t-xl" id="modal-header">
            <div class="flex items-center gap-3 overflow-hidden">
                <i class="fas fa-file-alt text-indigo-400"></i>
                <h2 id="modal-title" class="text-base font-bold truncate eng-text">Document Title</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="downloadFile()" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="HTML ফাইল ডাউনলোড করুন">
                    <i class="fas fa-download"></i>
                </button>
                <button onclick="printModal()" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="প্রিন্ট করুন">
                    <i class="fas fa-print"></i>
                </button>
                <button onclick="changeZoom(0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="ফন্ট বড় করুন">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button onclick="changeZoom(-0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="ফন্ট ছোট করুন">
                    <i class="fas fa-search-minus"></i>
                </button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                <button onclick="toggleMinimize()" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="মিনিমাইজ/ম্যাক্সিমাইজ" id="minimize-btn">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-red-600 hover:bg-red-700 rounded transition-colors ml-1" title="বন্ধ করুন">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <!-- Iframe Container -->
        <div class="flex-grow relative overflow-hidden bg-gray-100 rounded-b-xl" id="iframe-wrapper">
            <!-- Using transform scale on iframe for perfect zooming -->
            <iframe id="doc-iframe" class="absolute top-0 left-0 border-none origin-top-left transition-transform duration-200" style="width: 100%; height: 100%;"></iframe>
        </div>
    </div>

            { name: "D.H. Lawrence", life: "1885 - 1930", era: "The Modern Period", years: "1901-1939", works: "Sons and Lovers, Lady Chatterley's Lover, The Rainbow, Women in Love, Snake", file: "EnglishPoets/note_on_d_h_lawrence_emam_mehedi.html", wiki: "D._H._Lawrence" },
            { name: "T.S. Eliot", life: "1888 - 1965", era: "The Modern Period", years: "1901-1939", works: "The Waste Land, The Hollow Men, Four Quartets, The Love Song of J. Alfred Prufrock, Murder in the Cathedral", file: "EnglishPoets/note_on_t_s_eliot_emam_mehedi.html", wiki: "T._S._Eliot" },
            { name: "Pearl S. Buck", life: "1892 - 1973", era: "American Literature", years: "Modern Period", works: "The Good Earth, Sons, A House Divided, East Wind: West Wind, Dragon Seed", file: "EnglishPoets/note_on_pearl_s_buck_emam_mehedi.html", wiki: "Pearl_S._Buck" },
            { name: "Ernest Hemingway", life: "1899 - 1961", era: "American Literature", years: "Lost Generation", works: "The Old Man and the Sea, A Farewell to Arms, For Whom the Bell Tolls, The Sun Also Rises, The Killers", file: "EnglishPoets/note_on_ernest_hemingway_emam_mehedi.html", wiki: "Ernest_Hemingway" },
            { name: "George Orwell", life: "1903 - 1950", era: "The Modern Period", years: "1901-1939", works: "1984, Animal Farm, Shooting an Elephant, Burmese Days, Homage to Catalonia", file: "EnglishPoets/note_on_george_orwell_emam_mehedi.html", wiki: "George_Orwell" },
            { name: "Jean-Paul Sartre", life: "1905 - 1980", era: "Modern / Post-Modern", years: "1901-Present", works: "Nausea, Being and Nothingness, No Exit, The Flies, The Words", file: "EnglishPoets/note_on_jean_paul_sartre_emam_mehedi.html", wiki: "Jean-Paul_Sartre" },
            { name: "Samuel Beckett", life: "1906 - 1989", era: "Post-Modern Period", years: "1939-Present", works: "Waiting for Godot, Endgame, Happy Days, Krapp's Last Tape, Murphy", file: "EnglishPoets/note_on_samuel_beckett_emam_mehedi.html", wiki: "Samuel_Beckett" },
            { name: "William Golding", life: "1911 - 1993", era: "Post-Modern Period", years: "1939-Present", works: "Lord of the Flies, Rites of Passage, The Inheritors, Pincher Martin, Free Fall", file: "EnglishPoets/note_on_william_golding_emam_mehedi.html", wiki: "William_Golding" },
            { name: "Arthur Miller", life: "1915 - 2005", era: "American Literature", years: "Post-Modern", works: "Death of a Salesman, The Crucible, All My Sons, A View from the Bridge, The Misfits", file: "EnglishPoets/note_on_arthur_miller_emam_mehedi.html", wiki: "Arthur_Miller" },
            { name: "Chinua Achebe", life: "1930 - 2013", era: "Post-colonialism", years: "1939-Present", works: "Things Fall Apart, No Longer at Ease, Arrow of God, A Man of the People, Anthills of the Savannah", file: "EnglishPoets/note_on_chinua_achebe_emam_mehedi.html", wiki: "Chinua_Achebe" },
            { name: "A.P.J. Abdul Kalam", life: "1931 - 2015", era: "Contemporary Era", years: "Contemporary", works: "Wings of Fire, Ignited Minds, India 2020, The Luminous Sparks, Mission India", file: "EnglishPoets/note_on_a_p_j_abdul_kalam_emam_mehedi.html", wiki: "A._P._J._Abdul_Kalam" },
            { name: "Seamus Heaney", life: "1939 - 2013", era: "Post-Modern Period", years: "1939-Present", works: "Death of a Naturalist, North, The Spirit Level, Beowulf (Translation), Field Work", file: "EnglishPoets/note_on_seamus_heaney_emam_mehedi.html", wiki: "Seamus_Heaney" },
            { name: "Arundhati Roy", life: "1961 - Present", era: "Post-Modern Period", years: "Contemporary", works: "The God of Small Things, The Ministry of Utmost Happiness, The Algebra of Infinite Justice, The End of Imagination, Capitalism: A Ghost Story", file: "EnglishPoets/note_on_arundhati_roy_emam_mehedi.html", wiki: "Arundhati_Roy" }
        ];

        // Sort authors chronologically by birth year (and alphabetically if same year)
        authorsData.sort((a, b) => {
            const birthYearA = parseInt(a.life.match(/\d+/)[0]);
            const birthYearB = parseInt(b.life.match(/\d+/)[0]);
            if (birthYearA === birthYearB) {
                return a.name.localeCompare(b.name);
            }
            return birthYearA - birthYearB;
        });

        const grid = document.getElementById('author-grid');
        const countSpan = document.getElementById('count');

        function renderAuthors(authors) {
            grid.innerHTML = '';
            countSpan.innerText = authors.length;

            authors.forEach(author => {
                // Determine fallback image via UI Avatars if API fetch fails or is slow
                const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(author.name)}&background=random&color=fff&bold=true&size=128`;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-row items-center p-3 sm:p-4 gap-3 sm:gap-4 hover:-translate-y-1 hover:shadow-md hover:border-indigo-300 transition-all duration-300 group";
                
                card.innerHTML = `
                    <div class="flex-shrink-0">
                        <img id="img-${author.wiki}" src="${fallbackImg}" 
                             alt="${author.name}" 
                             class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-indigo-50 shadow-sm object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                    
                    <div class="flex-grow flex flex-col justify-center min-w-0">
                        <div class="flex flex-col xl:flex-row xl:items-center gap-1 xl:gap-2 mb-1">
                            <h3 class="text-base sm:text-lg font-bold text-gray-900 truncate eng-text leading-tight" title="${author.name}">${author.name} <span class="text-xs text-gray-500 font-semibold ml-1">(${author.life})</span></h3>
                        </div>
                        
                        <div class="mb-1.5">
                            <span class="inline-block bg-indigo-50 text-indigo-700 text-[10px] sm:text-xs px-2 py-0.5 rounded w-max eng-text font-medium border border-indigo-100">
                                ${author.era} (${author.years})
                            </span>
                        </div>
                        
                        <p class="text-sm sm:text-base text-black font-semibold line-clamp-2 eng-text leading-snug" title="${author.works}">
                            <i class="fas fa-book text-indigo-400 mr-1 text-sm"></i> ${author.works}
                        </p>
                    </div>
                    
                    <div class="flex-shrink-0 ml-1 sm:ml-2">
                        <button onclick="openModal('${author.file}', '${author.name}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs font-bold transition-colors shadow-sm border border-indigo-100 hover:border-indigo-600 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                            <i class="fas fa-external-link-alt"></i> <span class="hidden sm:inline">বিস্তারিত</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);

                // Dynamically fetch images using the Wikipedia API
                fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${author.wiki}&prop=pageimages&format=json&pithumbsize=200&origin=*`)
                    .then(res => res.json())
                    .then(data => {
                        const pages = data.query.pages;
                        const page = Object.values(pages)[0];
                        if (page.thumbnail && page.thumbnail.source) {
                            document.getElementById(`img-${author.wiki}`).src = page.thumbnail.source;
                        }
                    })
                    .catch(err => console.log("Image fetch failed for: " + author.name, err));
            });
        }

        // Search Function
        function filterAuthors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = authorsData.filter(author => 
                author.name.toLowerCase().includes(query) || 
                author.works.toLowerCase().includes(query) ||
                author.era.toLowerCase().includes(query)
            );
            renderAuthors(filtered);
        }

        // Modal Variables & Functions
        const modal = document.getElementById('reader-modal');
        const iframe = document.getElementById('doc-iframe');
        const titleEl = document.getElementById('modal-title');
        const iconBtn = document.getElementById('minimize-btn');
        let isMinimized = false;
        let currentZoom = 1;
        let currentFile = '';
        let currentFileName = '';

        function openModal(file, name) {
            titleEl.innerText = name + " - Notes";
            iframe.src = file;
            currentFile = file;
            currentFileName = name;
            currentZoom = 1;
            updateZoom();
            
            // Reset to full screen mode if minimized
            if(isMinimized) toggleMinimize();
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            iframe.src = '';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        function toggleMinimize() {
            if(!isMinimized) {
                // Minimize
                modal.classList.add('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-expand-arrows-alt"></i>';
                iconBtn.title = "ম্যাক্সিমাইজ করুন";
                isMinimized = true;
                document.body.style.overflow = 'auto';
            } else {
                // Maximize
                modal.classList.remove('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-compress-arrows-alt"></i>';
                iconBtn.title = "মিনিমাইজ করুন";
                isMinimized = false;
                document.body.style.overflow = 'hidden';
            }
        }

        async function printModal() {
            if (!currentFile) return;
            const urlParts = currentFile.split('/');
            const rawName = urlParts[urlParts.length - 1];
            const pdfName = rawName ? rawName.replace(/\.html?$/i, '') : currentFileName;

            try {
                // Fetch the HTML content so we can inject the correct title
                const res = await fetch(currentFile);
                let html = await res.text();

                // Replace or inject <title> tag with the filename
                if (/<title[^>]*>.*?<\/title>/i.test(html)) {
                    html = html.replace(/<title[^>]*>.*?<\/title>/i, `<title>${pdfName}</title>`);
                } else {
                    html = html.replace(/<head[^>]*>/i, `$&<title>${pdfName}</title>`);
                }

                // Open a blob URL in a new window and trigger print
                const blob = new Blob([html], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                const printWin = window.open(blobUrl, '_blank');
                if (printWin) {
                    printWin.onload = function () {
                        printWin.focus();
                        printWin.print();
                        setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
                    };
                }
            } catch (e) {
                // Fallback: just print the iframe directly
                const iframeWin = iframe.contentWindow;
                if (iframeWin) { iframeWin.focus(); iframeWin.print(); }
            }
        }

        function downloadFile() {
            if (!currentFile) return;
            const a = document.createElement('a');
            a.href = currentFile;
            // Extract filename from path or build from name
            const urlParts = currentFile.split('/');
            const rawName = urlParts[urlParts.length - 1];
            a.download = rawName || (currentFileName + '.html');
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function changeZoom(step) {
            currentZoom += step;
            if(currentZoom < 0.5) currentZoom = 0.5;
            if(currentZoom > 2.5) currentZoom = 2.5;
            updateZoom();
        }

        function updateZoom() {
            // Apply CSS transform to the iframe for cross-origin safe zooming
            iframe.style.transform = `scale(${currentZoom})`;
            iframe.style.width = `${100 / currentZoom}%`;
            iframe.style.height = `${100 / currentZoom}%`;
        }

        // Close modal on escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // Initial Render
        renderAuthors(authorsData);
    </script>
</body>
