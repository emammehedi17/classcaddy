<!DOCTYPE html>

    <title>English Literature Authors - Archive</title>

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->

    <style>
        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #F8FAFC;
            color: #1F2937;
        }
        .eng-text {
            font-family: 'Times New Roman', Times, serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #818cf8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
        
        /* Modal Transitions */
        #reader-modal {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-minimized {
            bottom: 20px !important;
            right: 20px !important;
            width: 380px !important;
            height: 480px !important;
            top: auto !important;
            left: auto !important;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 2px solid #4F46E5;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen pb-12">

    <!-- Navbar -->
    <nav class="bg-gradient-to-r from-slate-900 to-indigo-900 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row justify-between items-center py-4 gap-4">
                <div class="flex items-center gap-3">
                    <i class="fas fa-book-reader text-3xl text-yellow-400"></i>
                    <div>
                        <h1 class="text-2xl font-bold tracking-wide">সাহিত্যিকদের আর্কাইভ</h1>
                        <p class="text-xs text-indigo-200">BCS Preparation Note Hub</p>
                    </div>
                </div>
                <div class="w-full md:w-1/3 relative">
                    <input type="text" id="searchInput" onkeyup="filterAuthors()" placeholder="লেখকের নাম দিয়ে খুঁজুন..." 
                        class="w-full pl-10 pr-4 py-2.5 rounded-lg text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-yellow-400 shadow-inner">
                    <i class="fas fa-search absolute left-4 top-3.5 text-gray-400"></i>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        <div class="mb-5 flex justify-between items-center border-b border-gray-200 pb-2">
            <h2 class="text-xl font-bold text-gray-800 border-l-4 border-indigo-600 pl-3">সকল লেখক (<span id="count" class="eng-text"></span>)</h2>
        </div>

        <!-- Author Grid (Compact Layout) -->
        <div id="author-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Cards will be injected here by JS -->
        </div>
    </div>

    <!-- Reader Modal -->
    <div id="reader-modal" class="fixed inset-0 z-50 flex-col bg-white hidden">
        <!-- Modal Toolbar -->
        <div class="h-14 bg-slate-900 text-white flex justify-between items-center px-4 shadow-md select-none rounded-t-xl" id="modal-header">
            <div class="flex items-center gap-3 overflow-hidden">
                <i class="fas fa-file-alt text-indigo-400"></i>
                <h2 id="modal-title" class="text-base font-bold truncate eng-text">Document Title</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changeZoom(0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="Increase Font">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button onclick="changeZoom(-0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="Decrease Font">
                    <i class="fas fa-search-minus"></i>
                </button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                <button onclick="toggleMinimize()" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded transition-colors" title="Minimize/Maximize" id="minimize-btn">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-red-600 hover:bg-red-700 rounded transition-colors ml-1" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <!-- Iframe Container -->
        <div class="flex-grow relative overflow-hidden bg-gray-100 rounded-b-xl" id="iframe-wrapper">
            <!-- Using transform scale on iframe for perfect zooming -->
            <iframe id="doc-iframe" class="absolute top-0 left-0 border-none origin-top-left transition-transform duration-200" style="width: 100%; height: 100%;"></iframe>
        </div>
    </div>

            { name: "Emily Dickinson", life: "1830 - 1886", era: "American Literature", years: "19th Century", works: "Because I could not stop for Death, Hope is the thing with feathers, I taste a liquor never brewed, I died for Beauty, A Bird came down the Walk", file: "EnglishPoets/note_on_emily_dickinson_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/5/56/Black-white_photograph_of_Emily_Dickinson2.png" },
            { name: "Mark Twain", life: "1835 - 1910", era: "American Literature", years: "Realism", works: "The Adventures of Huckleberry Finn, The Adventures of Tom Sawyer, The Prince and the Pauper, A Connecticut Yankee in King Arthur's Court, Life on the Mississippi", file: "EnglishPoets/note_on_mark_twain_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/2/25/Mark_Twain%2C_Brady-Handy_photo_portrait%2C_Feb_7%2C_1871%2C_cropped.jpg" },
            { name: "O. Henry", life: "1862 - 1910", era: "American Literature", years: "Modern Period", works: "The Gift of the Magi, The Last Leaf, The Cop and the Anthem, After Twenty Years, Cabbages and Kings", file: "EnglishPoets/note_on_o_henry_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/7/75/O._Henry.jpg" },
            { name: "Robert Frost", life: "1874 - 1963", era: "American Literature", years: "Modern Period", works: "The Road Not Taken, Stopping by Woods on a Snowy Evening, Mending Wall, Birches, Fire and Ice", file: "EnglishPoets/note_on_robert_frost_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/4/45/Robert_Frost_NYWTS_1.jpg" },
            { name: "Pearl S. Buck", life: "1892 - 1973", era: "American Literature", years: "Modern Period", works: "The Good Earth, Sons, A House Divided, East Wind: West Wind, Dragon Seed", file: "EnglishPoets/note_on_pearl_s_buck_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/c/c5/Pearl_Buck_1932.jpg" },
            { name: "Ernest Hemingway", life: "1899 - 1961", era: "American Literature", years: "Lost Generation", works: "The Old Man and the Sea, A Farewell to Arms, For Whom the Bell Tolls, The Sun Also Rises, The Killers", file: "EnglishPoets/note_on_ernest_hemingway_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/2/28/ErnestHemingway.jpg" },
            { name: "Arthur Miller", life: "1915 - 2005", era: "American Literature", years: "Post-Modern", works: "Death of a Salesman, The Crucible, All My Sons, A View from the Bridge, The Misfits", file: "EnglishPoets/note_on_arthur_miller_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/8/82/Arthur_Miller_1966.jpg" },
            { name: "Robert Louis Stevenson", life: "1850 - 1894", era: "The Victorian Period", years: "1832-1901", works: "Treasure Island, Dr. Jekyll and Mr. Hyde, Kidnapped, A Child's Garden of Verses, The Black Arrow", file: "EnglishPoets/note_on_robert_louis_stevenson_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Robert_Louis_Stevenson_knox_portrait.jpg" },
            { name: "Rudyard Kipling", life: "1865 - 1936", era: "The Modern Period", years: "1901-1939", works: "The Jungle Book, Kim, Just So Stories, Plain Tales from the Hills, Gunga Din", file: "EnglishPoets/note_on_rudyard_kipling_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/b/bd/Rudyard_Kipling_1912.jpg" },
            { name: "Bertrand Russell", life: "1872 - 1970", era: "The Modern Period", years: "1901-Present", works: "A History of Western Philosophy, The Problems of Philosophy, The Conquest of Happiness, Marriage and Morals, Why I Am Not a Christian", file: "EnglishPoets/note_on_bertrand_russell_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/14/Bertrand_Russell_1950.jpg" },
            { name: "William Makepeace Thackeray", life: "1811 - 1863", era: "The Victorian Period", years: "1832-1901", works: "Vanity Fair, The Newcomes, The History of Henry Esmond, The Virginians, Barry Lyndon", file: "EnglishPoets/note_on_william_makepeace_thackeray_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/6/69/William_Makepeace_Thackeray_by_Jesse_Harrison_Whitehurst.jpg" },
            { name: "William Langland", life: "1332 - 1386", era: "The Middle English Period", years: "1066-1500", works: "Piers Plowman (Vision of Holy Church, Vision of the Seven Deadly Sins, Do-Well, Do-Better, Do-Best)", file: "EnglishPoets/note_on_william_langland_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Piers_Plowman.jpg" },
            { name: "Thomas Kyd", life: "1558 - 1594", era: "The Renaissance Period", years: "1558-1603", works: "The Spanish Tragedy, Ur-Hamlet (attributed), Cornelia, Soliman and Perseda, The Householder's Philosophy", file: "EnglishPoets/note_on_thomas_kyd_emam_mehedi.html", img: "https://ui-avatars.com/api/?name=Thomas+Kyd&background=18181B&color=fff&bold=true&size=128" },
            { name: "Sir Philip Sidney", life: "1554 - 1586", era: "The Renaissance Period", years: "1558-1603", works: "An Apology for Poetry, Astrophel and Stella, The Countess of Pembroke's Arcadia, The Lady of May, Defence of the Earl of Leicester", file: "EnglishPoets/note_on_sir_philip_sidney_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/13/Philip_Sidney.jpg" },
            { name: "Edmund Spenser", life: "1552 - 1599", era: "The Renaissance Period", years: "1558-1603", works: "The Faerie Queene, The Shepheardes Calender, Amoretti, Epithalamion, Prothalamion", file: "EnglishPoets/note_on_edmund_spenser_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Edmund_Spenser_oil_painting.jpg" },
            { name: "John Bunyan", life: "1628 - 1688", era: "The Restoration Period", years: "1660-1700", works: "The Pilgrim's Progress, The Life and Death of Mr. Badman, Grace Abounding to the Chief of Sinners, The Holy War, The Heavenly Footman", file: "EnglishPoets/note_on_john_bunyan_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/2/25/John_Bunyan_by_Thomas_Sadler.jpg" },
            { name: "Francis Bacon", life: "1561 - 1626", era: "Renaissance/Jacobean", years: "1558-1625", works: "Of Studies, Of Truth, Of Marriage and Single Life, Novum Organum, The New Atlantis", file: "EnglishPoets/francis_bacon_note.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/11/Francis_Bacon%2C_Viscount_St_Alban_from_NPG_%282%29.jpg" }
        ];

        // Sort authors chronologically by birth year
        authorsData.sort((a, b) => {
            const birthYearA = parseInt(a.life.match(/\d{4}/)[0]);
            const birthYearB = parseInt(b.life.match(/\d{4}/)[0]);
            if (birthYearA === birthYearB) {
                return a.name.localeCompare(b.name);
            }
            return birthYearA - birthYearB;
        });

        const grid = document.getElementById('author-grid');
        const countSpan = document.getElementById('count');

        function renderAuthors(authors) {
            grid.innerHTML = '';
            countSpan.innerText = authors.length;

            authors.forEach(author => {
                // Determine fallback image via UI Avatars if original fails
                const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(author.name)}&background=random&color=fff&bold=true&size=128`;
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex flex-row items-center p-3 sm:p-4 gap-3 sm:gap-4 hover:-translate-y-1 hover:shadow-md hover:border-indigo-300 transition-all duration-300 group";
                
                // Truncate works logic (CSS line-clamp used, but we can just pass the string)
                card.innerHTML = `
                    <div class="flex-shrink-0">
                        <img src="${author.img}" 
                             onerror="this.onerror=null; this.src='${fallbackImg}';" 
                             alt="${author.name}" 
                             class="w-16 h-16 sm:w-20 sm:h-20 rounded-full border-2 border-indigo-50 shadow-sm object-cover group-hover:scale-105 transition-transform duration-300">
                    </div>
                    
                    <div class="flex-grow flex flex-col justify-center min-w-0">
                        <div class="flex flex-col xl:flex-row xl:items-center gap-1 xl:gap-2 mb-1">
                            <h3 class="text-base sm:text-lg font-bold text-gray-900 truncate eng-text leading-tight" title="${author.name}">${author.name}</h3>
                            <span class="text-[10px] sm:text-xs text-gray-500 font-semibold eng-text bg-gray-100 px-1.5 py-0.5 rounded w-max whitespace-nowrap"><i class="fas fa-calendar-alt mr-1 text-gray-400"></i>${author.life}</span>
                        </div>
                        
                        <div class="mb-1.5">
                            <span class="inline-block bg-indigo-50 text-indigo-700 text-[10px] sm:text-xs px-2 py-0.5 rounded w-max eng-text font-medium border border-indigo-100">
                                ${author.era} (${author.years})
                            </span>
                        </div>
                        
                        <p class="text-xs sm:text-sm text-black line-clamp-2 eng-text leading-snug" title="${author.works}">
                            <i class="fas fa-book text-indigo-400 mr-1"></i> ${author.works}
                        </p>
                    </div>
                    
                    <div class="flex-shrink-0 ml-1 sm:ml-2">
                        <button onclick="openModal('${author.file}', '${author.name}')" class="bg-indigo-50 text-indigo-600 hover:bg-indigo-600 hover:text-white p-2 sm:px-3 sm:py-2 rounded-lg text-xs font-bold transition-colors shadow-sm border border-indigo-100 hover:border-indigo-600 flex items-center gap-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-300">
                            <i class="fas fa-external-link-alt"></i> <span class="hidden sm:inline">বিস্তারিত</span>
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Function
        function filterAuthors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = authorsData.filter(author => 
                author.name.toLowerCase().includes(query) || 
                author.works.toLowerCase().includes(query) ||
                author.era.toLowerCase().includes(query)
            );
            renderAuthors(filtered);
        }

        // Modal Variables & Functions
        const modal = document.getElementById('reader-modal');
        const iframe = document.getElementById('doc-iframe');
        const titleEl = document.getElementById('modal-title');
        const iconBtn = document.getElementById('minimize-btn');
        let isMinimized = false;
        let currentZoom = 1;

        function openModal(file, name) {
            titleEl.innerText = name + " - Notes";
            iframe.src = file;
            currentZoom = 1;
            updateZoom();
            
            // Reset to full screen mode if minimized
            if(isMinimized) toggleMinimize();
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            iframe.src = '';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        function toggleMinimize() {
            if(!isMinimized) {
                // Minimize
                modal.classList.add('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-expand-arrows-alt"></i>';
                iconBtn.title = "Maximize";
                isMinimized = true;
                document.body.style.overflow = 'auto';
            } else {
                // Maximize
                modal.classList.remove('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-compress-arrows-alt"></i>';
                iconBtn.title = "Minimize";
                isMinimized = false;
                document.body.style.overflow = 'hidden';
            }
        }

        function changeZoom(step) {
            currentZoom += step;
            if(currentZoom < 0.5) currentZoom = 0.5;
            if(currentZoom > 2.5) currentZoom = 2.5;
            updateZoom();
        }

        function updateZoom() {
            // Apply CSS transform to the iframe for cross-origin safe zooming
            iframe.style.transform = `scale(${currentZoom})`;
            iframe.style.width = `${100 / currentZoom}%`;
            iframe.style.height = `${100 / currentZoom}%`;
        }

        // Close modal on escape key
        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape" && !modal.classList.contains('hidden')) {
                closeModal();
            }
        });

        // Initial Render
        renderAuthors(authorsData);
    </script>
</body>
</html>
