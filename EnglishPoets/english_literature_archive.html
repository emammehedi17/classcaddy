    <style>
        body {

            color: #1F2937;
        }
        .eng-text {
            font-family: 'Times New Roman', Times, serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #6366f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #4f46e5; }
        
        .author-card {
            transition: all 0.3s ease;
        }
        .author-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #818CF8;
        }
        
        /* Modal Transitions */
        #reader-modal {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .modal-minimized {
            bottom: 20px !important;
            right: 20px !important;
            width: 400px !important;
            height: 500px !important;
            top: auto !important;
            left: auto !important;
            border-radius: 12px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 2px solid #4F46E5;
        }
    </style>
    <link rel="icon" type="image/png" href="../images/logo.png">

    <!-- Reader Modal -->

            <div class="flex items-center gap-3 overflow-hidden">
                <i class="fas fa-file-alt text-indigo-400"></i>
                <h2 id="modal-title" class="text-lg font-bold truncate eng-text">Document Title</h2>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="changeZoom(0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded-full transition-colors" title="Increase Font">
                    <i class="fas fa-search-plus"></i>
                </button>
                <button onclick="changeZoom(-0.1)" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded-full transition-colors" title="Decrease Font">
                    <i class="fas fa-search-minus"></i>
                </button>
                <div class="w-px h-6 bg-slate-600 mx-1"></div>
                <button onclick="toggleMinimize()" class="w-8 h-8 flex items-center justify-center hover:bg-slate-700 rounded-full transition-colors" title="Minimize/Maximize" id="minimize-btn">
                    <i class="fas fa-compress-arrows-alt"></i>
                </button>
                <button onclick="closeModal()" class="w-8 h-8 flex items-center justify-center bg-red-600 hover:bg-red-700 rounded-full transition-colors ml-1" title="Close">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <!-- Iframe Container -->
        <div class="flex-grow relative overflow-hidden bg-gray-100 rounded-b-xl" id="iframe-wrapper">

            <iframe id="doc-iframe" class="absolute top-0 left-0 border-none origin-top-left transition-transform duration-200" style="width: 100%; height: 100%;"></iframe>
        </div>

            { name: "Robert Louis Stevenson", life: "1850 - 1894", era: "The Victorian Period", years: "1832-1901", works: "Treasure Island, Dr. Jekyll and Mr. Hyde", file: "note_on_robert_louis_stevenson_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/1b/Robert_Louis_Stevenson_knox_portrait.jpg" },
            { name: "Rudyard Kipling", life: "1865 - 1936", era: "The Modern Period", years: "1901-1939", works: "The Jungle Book, Kim, Just So Stories", file: "note_on_rudyard_kipling_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/b/bd/Rudyard_Kipling_1912.jpg" },
            { name: "Bertrand Russell", life: "1872 - 1970", era: "The Modern Period", years: "1901-Present", works: "A History of Western Philosophy, The Conquest of Happiness", file: "note_on_bertrand_russell_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/14/Bertrand_Russell_1950.jpg" },
            { name: "William Makepeace Thackeray", life: "1811 - 1863", era: "The Victorian Period", years: "1832-1901", works: "Vanity Fair, The Newcomes", file: "note_on_william_makepeace_thackeray_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/6/69/William_Makepeace_Thackeray_by_Jesse_Harrison_Whitehurst.jpg" },
            { name: "William Langland", life: "1332 - 1386", era: "The Middle English Period", years: "1066-1500", works: "Piers Plowman", file: "note_on_william_langland_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/5/5a/Piers_Plowman.jpg" },
            { name: "Thomas Kyd", life: "1558 - 1594", era: "The Renaissance (Elizabethan)", years: "1558-1603", works: "The Spanish Tragedy", file: "note_on_thomas_kyd_emam_mehedi.html", img: "https://ui-avatars.com/api/?name=Thomas+Kyd&background=18181B&color=fff&bold=true&size=128" },
            { name: "Sir Philip Sidney", life: "1554 - 1586", era: "The Renaissance (Elizabethan)", years: "1558-1603", works: "An Apology for Poetry, Astrophel and Stella", file: "note_on_sir_philip_sidney_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/1/13/Philip_Sidney.jpg" },
            { name: "Edmund Spenser", life: "1552 - 1599", era: "The Renaissance (Elizabethan)", years: "1558-1603", works: "The Faerie Queene, Amoretti, The Shepheardes Calender", file: "note_on_edmund_spenser_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/6/6d/Edmund_Spenser_oil_painting.jpg" },
            { name: "John Bunyan", life: "1628 - 1688", era: "The Restoration Period", years: "1660-1700", works: "The Pilgrim's Progress, The Life and Death of Mr. Badman", file: "note_on_john_bunyan_emam_mehedi.html", img: "https://upload.wikimedia.org/wikipedia/commons/2/25/John_Bunyan_by_Thomas_Sadler.jpg" },
        ];

        // Sort authors alphabetically
        authorsData.sort((a, b) => a.name.localeCompare(b.name));

        const grid = document.getElementById('author-grid');
        const countSpan = document.getElementById('count');

        function renderAuthors(authors) {
            grid.innerHTML = '';
            countSpan.innerText = authors.length;

            authors.forEach(author => {
                // Determine fallback image via UI Avatars if original fails
                const fallbackImg = `https://ui-avatars.com/api/?name=${encodeURIComponent(author.name)}&background=random&color=fff&bold=true&size=128`;
                
                const card = document.createElement('div');
                card.className = "author-card bg-white rounded-xl shadow-md overflow-hidden flex flex-row h-48 border border-gray-200 group";
                card.innerHTML = `
                    <!-- Left Image Section -->
                    <div class="w-1/3 bg-indigo-50 flex flex-col items-center justify-center p-3 relative border-r border-gray-100">
                        <img src="${author.img}" 
                             onerror="this.onerror=null; this.src='${fallbackImg}';" 
                             alt="${author.name}" 
                             class="w-24 h-24 rounded-full border-4 border-white shadow-md object-cover mb-2 group-hover:scale-105 transition-transform duration-300">
                    </div>
                    
                    <!-- Right Content Section -->
                    <div class="w-2/3 p-4 flex flex-col justify-between relative">
                        <!-- Top Info -->
                        <div>
                            <h3 class="text-xl font-bold text-gray-900 truncate eng-text" title="${author.name}">${author.name}</h3>
                            <p class="text-xs text-gray-500 font-semibold mb-1 eng-text"><i class="fas fa-calendar-alt mr-1"></i> ${author.life}</p>
                            <span class="inline-block bg-indigo-100 text-indigo-800 text-xs px-2 py-1 rounded-full w-max mb-1 eng-text font-medium">
                                ${author.era} <span class="text-gray-500">(${author.years})</span>
                            </span>
                        </div>
                        
                        <!-- Middle Info (Works) -->
                        <div class="mb-8">
                            <p class="text-sm text-gray-600 line-clamp-2 italic eng-text">
                                <span class="text-gray-400 not-italic mr-1"><i class="fas fa-book"></i></span>
                                ${author.works}
                            </p>
                        </div>
                        
                        <!-- Bottom Button (Left Aligned under text) -->
                        <div class="absolute bottom-4 left-4">
                            <button onclick="openModal('${author.file}', '${author.name}')" class="bg-gradient-to-r from-indigo-600 to-blue-500 text-white px-5 py-1.5 rounded-lg text-sm font-semibold hover:shadow-lg hover:from-indigo-700 hover:to-blue-600 transition-all flex items-center gap-2">
                                <i class="fas fa-external-link-alt"></i> বিস্তারিত
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Search Function
        function filterAuthors() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = authorsData.filter(author => 
                author.name.toLowerCase().includes(query) || 
                author.works.toLowerCase().includes(query)
            );
            renderAuthors(filtered);
        }

        // Modal Variables & Functions
        const modal = document.getElementById('reader-modal');
        const iframe = document.getElementById('doc-iframe');
        const titleEl = document.getElementById('modal-title');
        const iconBtn = document.getElementById('minimize-btn');
        let isMinimized = false;
        let currentZoom = 1;

        function openModal(file, name) {
            titleEl.innerText = name + " - Notes";
            iframe.src = file;
            currentZoom = 1;
            updateZoom();
            
            // Reset to full screen mode if minimized
            if(isMinimized) toggleMinimize();
            
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.body.style.overflow = 'hidden'; // Stop background scrolling
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            iframe.src = '';
            document.body.style.overflow = 'auto'; // Restore scrolling
        }

        function toggleMinimize() {
            if(!isMinimized) {
                // Minimize
                modal.classList.add('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-expand-arrows-alt"></i>';
                iconBtn.title = "Maximize";
                isMinimized = true;
                document.body.style.overflow = 'auto';
            } else {
                // Maximize
                modal.classList.remove('modal-minimized');
                iconBtn.innerHTML = '<i class="fas fa-compress-arrows-alt"></i>';
                iconBtn.title = "Minimize";
                isMinimized = false;
                document.body.style.overflow = 'hidden';
            }
        }

        function changeZoom(step) {
            currentZoom += step;
            if(currentZoom < 0.5) currentZoom = 0.5;
            if(currentZoom > 2.5) currentZoom = 2.5;
            updateZoom();
        }

        function updateZoom() {
            // Apply CSS transform to the iframe for cross-origin safe zooming
            iframe.style.transform = `scale(${currentZoom})`;
            iframe.style.width = `${100 / currentZoom}%`;
            iframe.style.height = `${100 / currentZoom}%`;
        }

        // Initial Render
        renderAuthors(authorsData);
    </script>

    <!-- Floating Action Buttons (Scroll to Bottom/Top & Global Dark Mode) -->
    <button id="scroll-toggle-btn" class="fixed bottom-32 right-5 z-[100] w-12 h-12 bg-gray-700 hover:bg-gray-900 text-white rounded-full shadow-lg flex items-center justify-center transition-all duration-300 hover:scale-110 focus:outline-none opacity-90 hover:opacity-100" title="Scroll to Bottom" aria-label="Scroll to Bottom">
        <i class="fas fa-arrow-down"></i>
    </button>

    <button id="global-dark-mode-btn" class="fixed bottom-6 right-5 w-14 h-14 bg-gray-800 text-yellow-400 rounded-full shadow-lg border-2 border-gray-700 z-[999] flex items-center justify-center hover:scale-110 transition-transform" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
        <i class="fas fa-moon text-2xl"></i>
    </button>

<script type="module" src="../script.js"></script>
</body>
</html>
