            wordsContainer.className = "flex flex-wrap gap-2 md:gap-3 items-end";
            wordsContainer.setAttribute('dir', 'rtl');

                bnText.className = "text-xs md:text-sm text-gray-600 font-medium text-center";

                wordBlock.appendChild(bnText);
